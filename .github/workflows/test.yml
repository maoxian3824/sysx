name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        include:
          # 额外验证 macOS 上的降级行为（无 /proc）
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 显示环境信息
        run: |
          python --version
          uname -a

      - name: 语法检查
        run: python -m py_compile sysx.py tests/test_sysx.py

      - name: 运行测试套件
        run: python -m unittest discover -s tests -v

      - name: 严格模式（资源泄漏视为错误）
        if: matrix.os == 'ubuntu-latest'
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: 冒烟测试 — 全部子命令可运行
        run: |
          for cmd in info mem disk proc net env ports uptime doctor; do
            echo "=== sysx $cmd ==="
            python sysx.py "$cmd" > /dev/null
          done

      - name: 冒烟测试 — JSON 输出合法
        run: |
          for cmd in info mem disk proc net env ports uptime doctor; do
            python sysx.py "$cmd" -j > /tmp/out.json
            python -c "import json,sys; d=json.load(open('/tmp/out.json')); assert d is not None, 'JSON 输出为 null'" \
              || { echo "FAILED: $cmd JSON 输出非法"; exit 1; }
          done
          echo "所有子命令 JSON 输出合法"

      - name: 冒烟测试 — 彩色转义不应出现在管道输出中
        run: |
          if python sysx.py uptime | grep -q $'\033\['; then
            echo "FAILED: 非 TTY 环境下输出包含 ANSI 转义序列"
            exit 1
          fi
          echo "颜色自动禁用正常"

  package:
    name: 打包与安装验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装构建工具
        run: python -m pip install --upgrade pip build

      - name: 构建 wheel 与 sdist
        run: python -m build

      - name: 列出构建产物
        run: ls -lh dist/

      - name: 从 wheel 安装并验证入口命令
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/sysx --version
          /tmp/venv/bin/sysx info
          /tmp/venv/bin/sysx uptime

      - name: 校验零依赖
        run: python scripts/check_no_deps.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7
